name: Release

# Push a tag like v1.0.0 and this builds downloads for Windows, Linux and macOS
# and attaches them to a GitHub Release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: ubuntu-latest,  name: linux }
          - { os: macos-latest,   name: macos }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Work out version from the tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # jpackage only accepts plain numbers (1.2.3), so drop any -beta/-rc suffix
          echo "APP_VERSION=${VERSION%%-*}" >> "$GITHUB_ENV"

      - name: Set project version to match the tag
        shell: bash
        run: mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build fat jar (tests already ran in CI)
        shell: bash
        run: mvn -B -DskipTests package

      - name: Stage jar
        shell: bash
        run: |
          mkdir -p stage dist
          JAR=$(ls target/SentinelFS-*.jar | head -n 1)
          cp "$JAR" "stage/SentinelFS.jar"
          cp "$JAR" "dist/SentinelFS-${VERSION}.jar"

      - name: Package self-contained app (bundles its own Java runtime)
        shell: bash
        run: |
          jpackage --type app-image \
            --name SentinelFS \
            --app-version "$APP_VERSION" \
            --vendor "SentinelFS" \
            --description "File integrity and tamper-detection monitor" \
            --input stage \
            --main-jar SentinelFS.jar \
            --java-options "-Xmx512m" \
            --dest app

      - name: Zip (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path app/SentinelFS -DestinationPath "dist/SentinelFS-$env:VERSION-windows.zip"

      - name: Archive (Linux)
        if: matrix.name == 'linux'
        shell: bash
        run: tar -czf "dist/SentinelFS-${VERSION}-linux.tar.gz" -C app SentinelFS

      - name: Zip (macOS)
        if: matrix.name == 'macos'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent app/SentinelFS.app "dist/SentinelFS-${VERSION}-macos.zip"

      - name: Keep the plain jar from one job only
        if: matrix.name != 'linux'
        shell: bash
        run: rm -f "dist/SentinelFS-${VERSION}.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
